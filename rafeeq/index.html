<!DOCTYPE html>
<!--
  Rafeeq (رفيق) — A Web Companion for Elderly People and Their Families
  Competition: Intergraphity
  
  NOTE: In a real deployment, this would use Firebase Auth, Firestore, 
  and Cloud Functions instead of localStorage. Voice recordings would 
  be stored in Cloud Storage. Push notifications would use FCM.
  
  All user-facing text is in the TEXT object below (Modern Standard Arabic).
  Code comments are in English.
-->
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رفيق — رفيق والديك</title>
  <meta name="description" content="رفيق يذكّر والديك بأدويتهم بصوتك أنت، ويطمئنك أنّهم بخير.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       CSS CUSTOM PROPERTIES
       ============================================================ */
    :root {
      --clr-olive: #4A7C59;
      --clr-olive-dark: #3A6347;
      --clr-olive-light: #6B9E78;
      --clr-beige: #FDF8F0;
      --clr-beige-dark: #F0E6D3;
      --clr-blue: #5B8FB9;
      --clr-blue-light: #89B4D4;
      --clr-blue-dark: #3D6F8E;
      --clr-warm-white: #FFFDF9;
      --clr-text: #2D2A26;
      --clr-text-light: #5C5650;
      --clr-danger: #C0392B;
      --clr-danger-light: #E74C3C;
      --clr-warning: #E8A838;
      --clr-success: #27AE60;
      --clr-card: #FFFFFF;
      --clr-shadow: rgba(74, 124, 89, 0.12);
      --clr-overlay: rgba(45, 42, 38, 0.6);
      --radius-sm: 12px;
      --radius-md: 18px;
      --radius-lg: 24px;
      --radius-xl: 32px;
      --shadow-sm: 0 2px 8px var(--clr-shadow);
      --shadow-md: 0 4px 16px var(--clr-shadow);
      --shadow-lg: 0 8px 32px var(--clr-shadow);
      --font-base: var(--font-size-base, 22px);
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ============================================================
       RESET & BASE
       ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: var(--font-base);
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background: var(--clr-beige);
      color: var(--clr-text);
      line-height: 1.7;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    img { max-width: 100%; height: auto; display: block; }
    button { cursor: pointer; font-family: inherit; border: none; outline: none; }
    input, select, textarea { font-family: inherit; font-size: inherit; }
    a { color: inherit; text-decoration: none; }

    /* Focus styles for accessibility */
    *:focus-visible {
      outline: 3px solid var(--clr-blue);
      outline-offset: 3px;
      border-radius: 4px;
    }

    /* ============================================================
       UTILITY CLASSES
       ============================================================ */
    .hidden { display: none !important; }
    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    .section {
      display: none;
      animation: fadeIn 0.4s ease;
    }
    .section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes breathe {
      0%, 100% { transform: scale(0.6); opacity: 0.5; }
      50% { transform: scale(1); opacity: 1; }
    }

    @keyframes countUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes ripple {
      0% { transform: scale(0); opacity: 0.5; }
      100% { transform: scale(4); opacity: 0; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
      20%, 40%, 60%, 80% { transform: translateX(4px); }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      html { scroll-behavior: auto; }
    }

    /* ============================================================
       CONTAINER
       ============================================================ */
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .container-narrow {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* ============================================================
       FONT SIZE CONTROL
       ============================================================ */
    .font-control {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 1000;
      display: flex;
      gap: 6px;
      background: var(--clr-card);
      padding: 6px;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-md);
    }

    .font-control button {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: var(--clr-beige);
      color: var(--clr-text);
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .font-control button:hover {
      background: var(--clr-olive);
      color: white;
    }

    /* ============================================================
       BUTTONS
       ============================================================ */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 64px;
      padding: 14px 32px;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 600;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      text-align: center;
      line-height: 1.4;
    }

    .btn-lg {
      min-height: 80px;
      padding: 18px 40px;
      font-size: 1.15rem;
      border-radius: var(--radius-lg);
    }

    .btn-xl {
      min-height: 100px;
      padding: 24px 48px;
      font-size: 1.3rem;
      border-radius: var(--radius-xl);
      font-weight: 700;
    }

    .btn-primary {
      background: var(--clr-olive);
      color: white;
      box-shadow: var(--shadow-sm);
    }
    .btn-primary:hover { background: var(--clr-olive-dark); transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .btn-primary:active { transform: translateY(0); }

    .btn-secondary {
      background: var(--clr-blue);
      color: white;
      box-shadow: var(--shadow-sm);
    }
    .btn-secondary:hover { background: var(--clr-blue-dark); transform: translateY(-2px); }

    .btn-outline {
      background: transparent;
      border: 2px solid var(--clr-olive);
      color: var(--clr-olive);
    }
    .btn-outline:hover { background: var(--clr-olive); color: white; }

    .btn-danger {
      background: var(--clr-danger);
      color: white;
      box-shadow: 0 4px 16px rgba(192, 57, 43, 0.3);
    }
    .btn-danger:hover { background: var(--clr-danger-light); transform: translateY(-2px); }

    .btn-success {
      background: var(--clr-success);
      color: white;
    }
    .btn-success:hover { background: #219a52; }

    .btn-ghost {
      background: transparent;
      color: var(--clr-text-light);
    }
    .btn-ghost:hover { background: var(--clr-beige-dark); }

    .btn-block {
      display: flex;
      width: 100%;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    /* Ripple effect */
    .btn .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      animation: ripple 0.6s linear;
      pointer-events: none;
    }

    /* ============================================================
       CARDS
       ============================================================ */
    .card {
      background: var(--clr-card);
      border-radius: var(--radius-lg);
      padding: 28px;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .card:hover {
      box-shadow: var(--shadow-md);
    }

    .card-flat {
      background: var(--clr-beige);
      border-radius: var(--radius-md);
      padding: 20px;
    }

    /* ============================================================
       FORM ELEMENTS
       ============================================================ */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--clr-text);
    }

    .form-input {
      width: 100%;
      min-height: 56px;
      padding: 12px 18px;
      border: 2px solid var(--clr-beige-dark);
      border-radius: var(--radius-sm);
      background: var(--clr-warm-white);
      color: var(--clr-text);
      font-size: 1rem;
      transition: var(--transition);
    }

    .form-input:focus {
      border-color: var(--clr-olive);
      box-shadow: 0 0 0 3px rgba(74,124,89,0.15);
      outline: none;
    }

    .form-input::placeholder {
      color: #999;
    }

    .form-input.error {
      border-color: var(--clr-danger);
      animation: shake 0.4s ease;
    }

    .form-error {
      color: var(--clr-danger);
      font-size: 0.85rem;
      margin-top: 6px;
      display: none;
    }

    .form-error.visible {
      display: block;
    }

    /* ============================================================
       LANDING PAGE
       ============================================================ */
    .landing-hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(135deg, var(--clr-beige) 0%, var(--clr-beige-dark) 50%, #E8E0D0 100%);
      position: relative;
      overflow: hidden;
    }

    .landing-hero::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(74,124,89,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .landing-hero::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -10%;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(91,143,185,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 700px;
    }

    .hero-logo {
      font-size: 3.5rem;
      font-weight: 900;
      color: var(--clr-olive);
      margin-bottom: 8px;
      letter-spacing: -1px;
    }

    .hero-logo span {
      display: inline-block;
      animation: slideUp 0.6s ease backwards;
    }

    .hero-subtitle {
      font-size: 1.2rem;
      color: var(--clr-text-light);
      margin-bottom: 40px;
      line-height: 1.8;
    }

    .hero-buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .hero-wave {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      overflow: hidden;
    }

    .hero-wave svg {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 80px;
    }

    /* Stats section */
    .stats-section {
      padding: 80px 20px;
      background: var(--clr-warm-white);
      text-align: center;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 30px;
      margin-top: 40px;
    }

    .stat-card {
      padding: 30px 20px;
      border-radius: var(--radius-lg);
      background: var(--clr-card);
      box-shadow: var(--shadow-sm);
    }

    .stat-number {
      font-size: 3rem;
      font-weight: 900;
      color: var(--clr-olive);
      line-height: 1;
      margin-bottom: 8px;
      direction: ltr;
    }

    .stat-label {
      font-size: 0.9rem;
      color: var(--clr-text-light);
      line-height: 1.6;
    }

    /* Steps section */
    .steps-section {
      padding: 80px 20px;
      background: var(--clr-beige);
    }

    .section-title {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--clr-olive-dark);
      margin-bottom: 16px;
    }

    .section-subtitle {
      text-align: center;
      color: var(--clr-text-light);
      margin-bottom: 50px;
      font-size: 1rem;
    }

    .steps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 30px;
    }

    .step-card {
      text-align: center;
      padding: 40px 24px;
      background: var(--clr-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .step-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-lg);
    }

    .step-icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }

    .step-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--clr-olive);
      color: white;
      font-weight: 700;
      font-size: 0.85rem;
      margin-bottom: 12px;
    }

    .step-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--clr-text);
    }

    .step-desc {
      font-size: 0.9rem;
      color: var(--clr-text-light);
      line-height: 1.7;
    }

    /* Story section */
    .story-section {
      padding: 80px 20px;
      background: var(--clr-warm-white);
    }

    .story-card {
      max-width: 700px;
      margin: 0 auto;
      background: var(--clr-card);
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-lg);
    }

    .story-header {
      background: linear-gradient(135deg, var(--clr-olive) 0%, var(--clr-olive-light) 100%);
      padding: 30px;
      color: white;
      text-align: center;
    }

    .story-header h3 {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .story-body {
      padding: 32px;
    }

    .story-phase {
      padding: 20px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
    }

    .story-phase.before {
      background: #FFF5F5;
      border-right: 4px solid var(--clr-danger);
    }

    .story-phase.after {
      background: #F0FFF4;
      border-right: 4px solid var(--clr-success);
    }

    .story-phase-label {
      font-weight: 700;
      font-size: 0.85rem;
      margin-bottom: 8px;
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
    }

    .before .story-phase-label {
      background: var(--clr-danger);
      color: white;
    }

    .after .story-phase-label {
      background: var(--clr-success);
      color: white;
    }

    .story-phase p {
      font-size: 0.95rem;
      line-height: 1.8;
      color: var(--clr-text);
    }

    /* Closing */
    .closing-section {
      padding: 80px 20px;
      text-align: center;
      background: linear-gradient(135deg, var(--clr-olive-dark) 0%, var(--clr-olive) 100%);
      color: white;
    }

    .closing-text {
      max-width: 600px;
      margin: 0 auto;
      font-size: 1.2rem;
      line-height: 2;
      font-weight: 500;
    }

    /* ============================================================
       LOGIN SECTION
       ============================================================ */
    .login-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: var(--clr-beige);
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: var(--clr-card);
      border-radius: var(--radius-xl);
      padding: 40px 32px;
      box-shadow: var(--shadow-lg);
      text-align: center;
    }

    .login-logo {
      font-size: 2rem;
      font-weight: 900;
      color: var(--clr-olive);
      margin-bottom: 8px;
    }

    .login-subtitle {
      color: var(--clr-text-light);
      margin-bottom: 32px;
      font-size: 0.9rem;
    }

    .code-inputs {
      display: flex;
      gap: 12px;
      justify-content: center;
      direction: ltr;
      margin: 20px 0;
    }

    .code-input {
      width: 56px;
      height: 64px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      border: 2px solid var(--clr-beige-dark);
      border-radius: var(--radius-sm);
      background: var(--clr-warm-white);
      transition: var(--transition);
    }

    .code-input:focus {
      border-color: var(--clr-olive);
      box-shadow: 0 0 0 3px rgba(74,124,89,0.15);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--clr-text-light);
      margin-top: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: var(--transition);
    }

    .back-link:hover {
      color: var(--clr-olive);
    }

    /* ============================================================
       WIZARD
       ============================================================ */
    .wizard-section {
      min-height: 100vh;
      padding: 40px 20px;
      background: var(--clr-beige);
    }

    .wizard-progress {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    .wizard-step-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .wizard-dot {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--clr-beige-dark);
      color: var(--clr-text-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      transition: var(--transition);
    }

    .wizard-dot.active {
      background: var(--clr-olive);
      color: white;
      transform: scale(1.15);
    }

    .wizard-dot.done {
      background: var(--clr-success);
      color: white;
    }

    .wizard-line {
      width: 40px;
      height: 3px;
      background: var(--clr-beige-dark);
      align-self: center;
      border-radius: 2px;
      transition: var(--transition);
    }

    .wizard-line.done {
      background: var(--clr-success);
    }

    .wizard-card {
      max-width: 600px;
      margin: 0 auto;
      background: var(--clr-card);
      border-radius: var(--radius-xl);
      padding: 36px 28px;
      box-shadow: var(--shadow-lg);
    }

    .wizard-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--clr-olive-dark);
      margin-bottom: 24px;
      text-align: center;
    }

    .wizard-step { display: none; }
    .wizard-step.active { display: block; animation: fadeIn 0.3s ease; }

    .wizard-nav {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      margin-top: 28px;
    }

    /* Item list (meds, appointments, contacts) */
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .item-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      background: var(--clr-beige);
      border-radius: var(--radius-md);
      gap: 12px;
    }

    .item-info {
      flex: 1;
    }

    .item-name {
      font-weight: 700;
      font-size: 1rem;
    }

    .item-detail {
      font-size: 0.8rem;
      color: var(--clr-text-light);
    }

    .item-remove {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(192,57,43,0.1);
      color: var(--clr-danger);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: var(--transition);
    }

    .item-remove:hover {
      background: var(--clr-danger);
      color: white;
    }

    /* Photo upload placeholder */
    .photo-upload {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--clr-beige-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      cursor: pointer;
      margin: 0 auto 20px;
      transition: var(--transition);
      overflow: hidden;
      border: 3px dashed var(--clr-olive-light);
    }

    .photo-upload:hover {
      background: var(--clr-beige);
      border-color: var(--clr-olive);
    }

    .photo-upload img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ============================================================
       LINK GENERATED
       ============================================================ */
    .link-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: var(--clr-beige);
    }

    .link-card {
      max-width: 500px;
      width: 100%;
      background: var(--clr-card);
      border-radius: var(--radius-xl);
      padding: 40px 28px;
      box-shadow: var(--shadow-lg);
      text-align: center;
    }

    .link-success-icon {
      font-size: 4rem;
      margin-bottom: 16px;
    }

    .qr-placeholder {
      width: 200px;
      height: 200px;
      margin: 20px auto;
      background: white;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #eee;
      overflow: hidden;
    }

    .qr-placeholder canvas {
      image-rendering: pixelated;
    }

    .link-url {
      background: var(--clr-beige);
      padding: 14px;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      word-break: break-all;
      direction: ltr;
      text-align: center;
      margin: 16px 0;
      color: var(--clr-text-light);
    }

    /* ============================================================
       PARENT VIEW
       ============================================================ */
    .parent-section {
      min-height: 100vh;
      background: var(--clr-beige);
    }

    /* Start screen */
    .parent-start {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    .start-btn {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--clr-olive) 0%, var(--clr-olive-light) 100%);
      color: white;
      font-size: 2rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 40px rgba(74,124,89,0.3);
      transition: var(--transition);
      margin-bottom: 24px;
      cursor: pointer;
      border: none;
    }

    .start-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 12px 48px rgba(74,124,89,0.4);
    }

    .start-btn:active {
      transform: scale(0.96);
    }

    .start-explain {
      font-size: 0.9rem;
      color: var(--clr-text-light);
      max-width: 400px;
    }

    /* Parent home */
    .parent-home {
      padding: 24px 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .parent-greeting {
      text-align: center;
      margin-bottom: 32px;
    }

    .greeting-text {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--clr-olive-dark);
    }

    .greeting-name {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--clr-olive);
    }

    .parent-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .parent-grid-btn {
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--clr-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      font-size: 1rem;
      font-weight: 700;
      color: var(--clr-text);
      transition: var(--transition);
      padding: 16px;
      text-align: center;
      cursor: pointer;
      border: none;
    }

    .parent-grid-btn:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
    }

    .parent-grid-btn:active {
      transform: translateY(0);
    }

    .parent-grid-btn .icon {
      font-size: 2.2rem;
    }

    .parent-grid-btn.emergency {
      background: linear-gradient(135deg, #C0392B, #E74C3C);
      color: white;
      grid-column: 1 / -1;
    }

    .parent-grid-btn.emergency:hover {
      box-shadow: 0 8px 24px rgba(192,57,43,0.3);
    }

    /* Parent sub-views */
    .parent-subview {
      display: none;
      padding: 24px 16px;
      max-width: 600px;
      margin: 0 auto;
      animation: fadeIn 0.3s ease;
    }

    .parent-subview.active {
      display: block;
    }

    .subview-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .subview-back {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--clr-card);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      border: none;
      transition: var(--transition);
    }

    .subview-back:hover {
      background: var(--clr-beige-dark);
    }

    .subview-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--clr-olive-dark);
    }

    /* Medication list */
    .med-item {
      background: var(--clr-card);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .med-icon {
      font-size: 2rem;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--clr-beige);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .med-info { flex: 1; }

    .med-name {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .med-time {
      font-size: 0.85rem;
      color: var(--clr-text-light);
    }

    .med-take-btn {
      min-height: 56px;
      padding: 10px 20px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.9rem;
      transition: var(--transition);
      border: none;
      cursor: pointer;
    }

    .med-take-btn.not-taken {
      background: var(--clr-olive);
      color: white;
    }

    .med-take-btn.taken {
      background: var(--clr-beige);
      color: var(--clr-success);
      pointer-events: none;
    }

    /* Emergency */
    .emergency-view {
      text-align: center;
      padding-top: 40px;
    }

    .emergency-big-btn {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: linear-gradient(135deg, #C0392B, #E74C3C);
      color: white;
      font-size: 1.3rem;
      font-weight: 900;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 30px auto;
      box-shadow: 0 8px 40px rgba(192,57,43,0.3);
      transition: var(--transition);
      cursor: pointer;
      border: none;
      animation: pulse 2s infinite;
    }

    .emergency-big-btn:hover {
      transform: scale(1.05);
    }

    .emergency-big-btn .icon {
      font-size: 3rem;
    }

    .emergency-contacts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin-top: 24px;
    }

    .emergency-contact-btn {
      background: var(--clr-card);
      border-radius: var(--radius-lg);
      padding: 20px;
      text-align: center;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      cursor: pointer;
      border: none;
      font-family: inherit;
      font-size: inherit;
    }

    .emergency-contact-btn:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    .contact-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--clr-olive-light);
      color: white;
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 10px;
    }

    /* Day view */
    .day-view-card {
      background: var(--clr-card);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      text-align: center;
    }

    .day-date {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--clr-olive-dark);
    }

    .day-time {
      font-size: 2rem;
      font-weight: 900;
      color: var(--clr-olive);
      margin: 8px 0;
      direction: ltr;
      display: inline-block;
    }

    .day-weather {
      font-size: 1.1rem;
      color: var(--clr-text-light);
    }

    .day-weather .icon {
      font-size: 2rem;
    }

    .daily-wisdom {
      background: linear-gradient(135deg, var(--clr-olive) 0%, var(--clr-olive-light) 100%);
      color: white;
      padding: 28px;
      border-radius: var(--radius-lg);
      text-align: center;
      font-size: 1.1rem;
      line-height: 2;
      margin-top: 16px;
    }

    /* Mood check */
    .mood-section {
      text-align: center;
      margin-top: 24px;
    }

    .mood-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .mood-options {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .mood-btn {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-lg);
      background: var(--clr-card);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 2rem;
      cursor: pointer;
      border: 3px solid transparent;
      transition: var(--transition);
    }

    .mood-btn:hover {
      transform: scale(1.1);
      border-color: var(--clr-olive);
    }

    .mood-btn.selected {
      border-color: var(--clr-olive);
      background: var(--clr-beige);
    }

    .mood-label {
      font-size: 0.55rem;
      font-weight: 600;
      color: var(--clr-text-light);
    }

    /* Wellbeing */
    .wellbeing-section {
      margin-top: 24px;
    }

    .breathing-circle {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--clr-blue-light), var(--clr-blue));
      margin: 30px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .breathing-circle.active {
      animation: breathe 6s ease-in-out infinite;
    }

    .stretch-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 16px;
    }

    .stretch-item {
      background: var(--clr-card);
      padding: 18px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.95rem;
    }

    .stretch-icon {
      font-size: 2rem;
      width: 50px;
      text-align: center;
    }

    /* Memory game */
    .memory-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 400px;
      margin: 20px auto;
    }

    .memory-card-cell {
      aspect-ratio: 1;
      background: var(--clr-olive);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      cursor: pointer;
      transition: var(--transition);
      color: white;
      font-weight: 700;
      border: none;
      font-family: inherit;
    }

    .memory-card-cell.flipped {
      background: var(--clr-card);
      box-shadow: var(--shadow-sm);
    }

    .memory-card-cell.matched {
      background: var(--clr-success);
      color: white;
      pointer-events: none;
    }

    .game-score {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--clr-olive);
      margin: 16px 0;
    }

    /* ============================================================
       MEDICINE ALARM OVERLAY
       ============================================================ */
    .alarm-overlay {
      position: fixed;
      inset: 0;
      background: rgba(74,124,89,0.97);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .alarm-overlay.active {
      display: flex;
    }

    .alarm-content {
      text-align: center;
      color: white;
      max-width: 500px;
      width: 100%;
      animation: slideUp 0.5s ease;
    }

    .alarm-child-photo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      overflow: hidden;
    }

    .alarm-child-name {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 24px;
      opacity: 0.9;
    }

    .alarm-med-name {
      font-size: 2rem;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .alarm-med-note {
      font-size: 1.1rem;
      opacity: 0.9;
      margin-bottom: 40px;
    }

    .alarm-icon {
      font-size: 4rem;
      margin-bottom: 16px;
      animation: pulse 1.5s infinite;
    }

    .alarm-buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .alarm-take-btn {
      min-height: 80px;
      background: white;
      color: var(--clr-olive-dark);
      border-radius: var(--radius-lg);
      font-size: 1.3rem;
      font-weight: 800;
      border: none;
      cursor: pointer;
      transition: var(--transition);
    }

    .alarm-take-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .alarm-snooze-btn {
      min-height: 64px;
      background: rgba(255,255,255,0.15);
      color: white;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: var(--transition);
    }

    .alarm-snooze-btn:hover {
      background: rgba(255,255,255,0.25);
    }

    /* ============================================================
       FAMILY DASHBOARD
       ============================================================ */
    .dashboard-section {
      padding: 24px 16px 100px;
      max-width: 800px;
      margin: 0 auto;
    }

    .dashboard-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .dashboard-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--clr-olive-dark);
    }

    .dash-status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .dash-status-card {
      background: var(--clr-card);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }

    .dash-status-card.alert {
      border: 2px solid var(--clr-warning);
      background: #FFFBF0;
    }

    .dash-med-status {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--clr-beige-dark);
    }

    .dash-med-status:last-child {
      border-bottom: none;
    }

    .status-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot.taken { background: var(--clr-success); }
    .status-dot.missed { background: var(--clr-danger); }
    .status-dot.pending { background: var(--clr-warning); }

    /* Mood chart */
    .mood-chart-container {
      background: var(--clr-card);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
    }

    .mood-chart-container h3 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--clr-olive-dark);
      margin-bottom: 16px;
    }

    .mood-chart {
      width: 100%;
      height: 200px;
    }

    /* Voice recording section */
    .voice-section {
      background: var(--clr-card);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
    }

    .voice-section h3 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--clr-olive-dark);
      margin-bottom: 8px;
    }

    .voice-explain {
      font-size: 0.85rem;
      color: var(--clr-text-light);
      margin-bottom: 20px;
    }

    .voice-med-item {
      background: var(--clr-beige);
      border-radius: var(--radius-md);
      padding: 18px;
      margin-bottom: 12px;
    }

    .voice-med-name {
      font-weight: 700;
      margin-bottom: 12px;
    }

    .voice-controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .voice-btn {
      min-height: 48px;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
      border: none;
      cursor: pointer;
    }

    .voice-btn.record {
      background: var(--clr-danger);
      color: white;
    }

    .voice-btn.record.recording {
      animation: pulse 1s infinite;
    }

    .voice-btn.play {
      background: var(--clr-blue);
      color: white;
    }

    .voice-btn.save {
      background: var(--clr-success);
      color: white;
    }

    .voice-btn.preview {
      background: var(--clr-olive);
      color: white;
    }

    .recording-timer {
      font-weight: 700;
      color: var(--clr-danger);
      font-size: 1rem;
      direction: ltr;
    }

    .voice-status {
      font-size: 0.8rem;
      color: var(--clr-success);
      margin-top: 8px;
    }

    /* Dashboard edit sections */
    .dash-edit-section {
      background: var(--clr-card);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
    }

    .dash-edit-section h3 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--clr-olive-dark);
      margin-bottom: 16px;
    }

    /* Alerts panel */
    .alerts-panel {
      background: #FFF5F5;
      border: 2px solid var(--clr-danger);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 24px;
      display: none;
    }

    .alerts-panel.has-alerts {
      display: block;
    }

    .alert-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(192,57,43,0.1);
    }

    .alert-item:last-child { border-bottom: none; }

    .alert-icon { font-size: 1.3rem; }

    .alert-text {
      flex: 1;
      font-size: 0.9rem;
      color: var(--clr-danger);
      font-weight: 600;
    }

    .alert-dismiss {
      font-size: 0.8rem;
      color: var(--clr-text-light);
      cursor: pointer;
      border: none;
      background: none;
      font-family: inherit;
      padding: 4px 8px;
    }

    /* ============================================================
       FLOATING NAVIGATION
       ============================================================ */
    .float-nav {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      background: var(--clr-card);
      padding: 10px 16px;
      border-radius: 50px;
      box-shadow: var(--shadow-lg);
      z-index: 900;
    }

    .float-nav-btn {
      min-height: 48px;
      padding: 8px 18px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.8rem;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      cursor: pointer;
      background: var(--clr-beige);
      color: var(--clr-text);
    }

    .float-nav-btn:hover {
      background: var(--clr-olive);
      color: white;
    }

    .float-nav-btn.active {
      background: var(--clr-olive);
      color: white;
    }

    /* Demo alarm button */
    .demo-alarm-btn {
      position: fixed;
      bottom: 80px;
      left: 20px;
      z-index: 800;
      min-height: 48px;
      padding: 10px 18px;
      border-radius: 30px;
      background: var(--clr-warning);
      color: var(--clr-text);
      font-weight: 700;
      font-size: 0.8rem;
      box-shadow: var(--shadow-md);
      border: none;
      cursor: pointer;
      transition: var(--transition);
      display: none;
    }

    .demo-alarm-btn.visible {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .demo-alarm-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    /* Confirmation dialog */
    .confirm-overlay {
      position: fixed;
      inset: 0;
      background: var(--clr-overlay);
      z-index: 8000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .confirm-overlay.active {
      display: flex;
    }

    .confirm-card {
      background: var(--clr-card);
      border-radius: var(--radius-xl);
      padding: 36px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      animation: slideUp 0.3s ease;
    }

    .confirm-icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }

    .confirm-text {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 24px;
      line-height: 1.7;
    }

    .confirm-buttons {
      display: flex;
      gap: 12px;
    }

    .confirm-buttons .btn {
      flex: 1;
    }

    /* Toast notifications */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      background: var(--clr-card);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideIn 0.3s ease;
      min-width: 280px;
      max-width: 420px;
    }

    .toast.success { border-right: 4px solid var(--clr-success); }
    .toast.error { border-right: 4px solid var(--clr-danger); }
    .toast.warning { border-right: 4px solid var(--clr-warning); }
    .toast.info { border-right: 4px solid var(--clr-blue); }

    .toast-icon { font-size: 1.3rem; }
    .toast-text { flex: 1; font-size: 0.85rem; font-weight: 500; }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 768px) {
      .hero-logo { font-size: 2.5rem; }
      .hero-subtitle { font-size: 1rem; }
      .stats-grid { grid-template-columns: 1fr; }
      .steps-grid { grid-template-columns: 1fr; }
      .parent-grid { gap: 12px; }
      .parent-grid-btn { min-height: 100px; }
      .emergency-contacts { grid-template-columns: 1fr 1fr; }
      .dashboard-header { flex-direction: column; text-align: center; }
      .float-nav { padding: 8px 12px; gap: 6px; }
      .float-nav-btn { padding: 8px 12px; font-size: 0.75rem; }
      .memory-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 480px) {
      .hero-buttons { flex-direction: column; align-items: center; }
      .hero-buttons .btn { width: 100%; }
      .parent-grid { grid-template-columns: 1fr; }
      .mood-options { gap: 8px; }
      .mood-btn { width: 64px; height: 64px; }
      .confirm-buttons { flex-direction: column; }
      .memory-grid { grid-template-columns: repeat(3, 1fr); }
      .float-nav { width: calc(100% - 32px); justify-content: center; }
    }

    @media (min-width: 1024px) {
      .parent-grid { grid-template-columns: repeat(3, 1fr); }
      .parent-grid-btn.emergency { grid-column: 1 / -1; }
    }

    /* ============================================================
       PRINT HIDDEN ELEMENTS
       ============================================================ */
    @media print {
      .font-control, .float-nav, .demo-alarm-btn { display: none !important; }
    }

    /* ============================================================
       SCROLLBAR STYLING
       ============================================================ */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--clr-beige); }
    ::-webkit-scrollbar-thumb {
      background: var(--clr-olive-light);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--clr-olive); }

    /* ============================================================
       DAILY QUESTION
       ============================================================ */
    .daily-question-card {
      background: var(--clr-card);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      text-align: center;
      margin-top: 16px;
    }

    .dq-question {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      line-height: 1.8;
    }

    .dq-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dq-option {
      padding: 14px;
      border-radius: var(--radius-md);
      background: var(--clr-beige);
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      border: 2px solid transparent;
      text-align: center;
      font-family: inherit;
      font-size: inherit;
    }

    .dq-option:hover {
      border-color: var(--clr-olive);
      background: var(--clr-warm-white);
    }

    .dq-option.correct {
      background: #E8F5E9;
      border-color: var(--clr-success);
      color: var(--clr-success);
    }

    .dq-option.wrong {
      background: #FFEBEE;
      border-color: var(--clr-danger);
      color: var(--clr-danger);
    }
  </style>
</head>

  <script>
    // ============================================================
    // TEXT OBJECT — All Arabic strings in one place

    const TEXT = {
      // App

      // Landing hero

      // Stats
      statsTitle: 'المشكلة التي نحلّها',
      stat1Label: 'من كبار السنّ في الأردنّ يعيشون بعيدًا عن أبنائهم',

    // ============================================================
    // INITIALIZATION
    // ============================================================
    function init() {
      loadState();
      applyText();
      applyFontSize();

      if (state.loggedIn) {
        if (state.currentView === 'parentView' || state.currentView === 'dashboard') {
          showSection(state.currentView, true);
        } else {
          showSection('dashboard', true);
        }
      } else {
        showSection('landing', true);
      }

      // Start animated counters when landing is visible
      if (state.currentView === 'landing' || !state.loggedIn) {
        startCounters();
      }

      // Code input auto-advance
      setupCodeInputs();
    }

    function loadState() {
      try {
        const saved = localStorage.getItem('rafeeq_state');
        if (saved) {
          const parsed = JSON.parse(saved);
          state = { ...JSON.parse(JSON.stringify(DEFAULT_STATE)), ...parsed };
        }
      } catch (e) {
        console.error('Failed to load state:', e);
      }
    }

    function saveState() {
      try {
        localStorage.setItem('rafeeq_state', JSON.stringify(state));
      } catch (e) {
        console.error('Failed to save state:', e);
      }
    }

    // ============================================================
    // FONT SIZE
    // ============================================================
    function changeFontSize(delta) {
      state.fontSize = Math.max(16, Math.min(32, state.fontSize + (delta * 2)));
      applyFontSize();
      saveState();
    }

    function applyFontSize() {
      document.documentElement.style.setProperty('--font-size-base', state.fontSize + 'px');
    }

    // ============================================================
    // SECTION NAVIGATION
    // ============================================================
    function showSection(id, skipSave) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      const section = document.getElementById(id);
      if (section) section.classList.add('active');

      // Float nav visibility
      const floatNav = document.getElementById('floatNav');
      const demoBtn = document.getElementById('demoAlarmBtn');
      if (state.loggedIn && (id === 'parentView' || id === 'dashboard')) {
        floatNav.classList.remove('hidden');
        demoBtn.classList.add('visible');
        // Highlight active tab
        document.querySelectorAll('.float-nav-btn').forEach(b => b.classList.remove('active'));
        if (id === 'parentView') document.getElementById('floatParent').classList.add('active');
        if (id === 'dashboard') document.getElementById('floatDashboard').classList.add('active');
      } else {
        floatNav.classList.add('hidden');
        demoBtn.classList.remove('visible');
      }

      // Section-specific setup
      if (id === 'parentView') {
        setupParentView();

      if (id === 'dashboard') {

        populateWizardFields();

      state.currentView = id;
      if (!skipSave) saveState();
      window.scrollTo(0, 0);
    }

    // ============================================================
    // ANIMATED COUNTERS
    // ============================================================
    function startCounters() {
      const counters = document.querySelectorAll('.stat-number');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            animateCounter(entry.target);
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.5 });
      counters.forEach(c => observer.observe(c));
    }

    function animateCounter(el) {
      const target = parseInt(el.dataset.target);
      const suffix = el.dataset.suffix || '';
      let current = 0;
      const step = Math.ceil(target / 40);
      const interval = setInterval(() => {
        current += step;
        if (current >= target) {
          current = target;
          clearInterval(interval);
        }
        el.textContent = current + suffix;
      }, 40);
    }

    function sendVerificationCode() {
      const phone = document.getElementById('phoneInput').value.trim();

      if (!/^07\d{8}$/.test(phone)) {
        phoneError.classList.add('visible');

        return;

    function setupCodeInputs() {
      const inputs = document.querySelectorAll('.code-input');
      inputs.forEach((input, i) => {
        input.addEventListener('input', (e) => {
          if (e.target.value.length === 1 && i < inputs.length - 1) {
            inputs[i + 1].focus();
          }
        });
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !e.target.value && i > 0) {
            inputs[i - 1].focus();
          }
          if (e.key === 'Enter') {
            verifyCode();
          }
        });
      });
    }

    function verifyCode() {
      const inputs = document.querySelectorAll('.code-input');
      const code = Array.from(inputs).map(i => i.value).join('');
      const codeError = document.getElementById('codeError');

      if (code.length < 4) {
        codeError.classList.add('visible');
        return;
      }

      codeError.classList.remove('visible');
      state.loggedIn = true;
      state.wizardStep = 1;
      saveState();
      showSection('wizard');

    // ============================================================
    // QR CODE (simple visual simulation)
    // ============================================================
    function generateQRCode() {
      const container = document.getElementById('qrCode');
      const canvas = document.createElement('canvas');
      canvas.width = 180;
      canvas.height = 180;
      const ctx = canvas.getContext('2d');
      const size = 6;
      const modules = 29;

      // Generate a deterministic pseudo-random QR pattern
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#000000';

      // Position markers (top-left, top-right, bottom-left)
      function drawFinder(x, y) {
        for (let r = 0; r < 7; r++) {
          for (let c = 0; c < 7; c++) {
            if (r === 0 || r === 6 || c === 0 || c === 6 || (r >= 2 && r <= 4 && c >= 2 && c <= 4)) {
              ctx.fillRect((x + c) * size + 3, (y + r) * size + 3, size, size);
            }
          }
        }
      }

      drawFinder(0, 0);
      drawFinder(22, 0);
      drawFinder(0, 22);

      // Fill with pseudo-random data pattern
      const seed = (state.parentName || 'rafeeq').length * 7 + 42;
      for (let r = 0; r < modules; r++) {
        for (let c = 0; c < modules; c++) {
          if ((r < 8 && c < 8) || (r < 8 && c > 20) || (r > 20 && c < 8)) continue;
          if (((r * 31 + c * 17 + seed) % 3) === 0) {
            ctx.fillRect(c * size + 3, r * size + 3, size, size);
          }
        }
      }

      container.innerHTML = '';
      container.appendChild(canvas);

      // Set link URL
      const link = `rafeeq.app/p/${btoa(state.parentName || 'parent').substring(0, 8)}`;
      document.getElementById('parentLinkUrl').textContent = link;
    }

    function unlockParentAudio() {
      // Create and play a silent audio context to unlock audio
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        gain.gain.value = 0;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
        ctx.resume();
      } catch (e) {
        console.log('Audio context init failed:', e);
      }

      state.audioUnlocked = true;
      saveState();
      showParentHome();

      // Request notification permission
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
    }

      // Remove from alarms

      // Remove alert for this med

    function initMemoryGame() {
      const emojis = ['🌸', '🌺', '🍎', '🌙', '⭐', '🕌'];
      const pairs = [...emojis, ...emojis];
      // Shuffle
      for (let i = pairs.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
      }

      memoryCards = pairs;
      memoryFlipped = [];
      memoryMatched = new Array(pairs.length).fill(false);
      memoryMoves = 0;
      memoryLocked = false;

      renderMemoryGrid();
      const mc = document.getElementById('memoryMovesCount');
      if (mc) mc.textContent = '0';
    }

    function renderMemoryGrid() {
      const grid = document.getElementById('memoryGrid');
      if (!grid) return;
      grid.innerHTML = memoryCards.map((card, i) => {
        const isFlipped = memoryFlipped.includes(i) || memoryMatched[i];
        return `<button class="memory-card-cell ${isFlipped ? 'flipped' : ''} ${memoryMatched[i] ? 'matched' : ''}"
                onclick="flipCard(${i})"
                aria-label="بطاقة ${i + 1}">
          ${isFlipped ? card : '❓'}
        </button>`;
      }).join('');
    }

    function flipCard(index) {
      if (memoryLocked || memoryFlipped.includes(index) || memoryMatched[index]) return;
      memoryFlipped.push(index);
      renderMemoryGrid();

      if (memoryFlipped.length === 2) {
        memoryLocked = true;
        memoryMoves++;
        const mc = document.getElementById('memoryMovesCount');
        if (mc) mc.textContent = memoryMoves;

        const [a, b] = memoryFlipped;
        if (memoryCards[a] === memoryCards[b]) {
          memoryMatched[a] = true;
          memoryMatched[b] = true;
          memoryFlipped = [];
          memoryLocked = false;
          renderMemoryGrid();

          if (memoryMatched.every(Boolean)) {
            setTimeout(() => showToast(TEXT.memoryWin, 'success'), 300);
          }
        } else {
          setTimeout(() => {
            memoryFlipped = [];
            memoryLocked = false;
            renderMemoryGrid();
          }, 800);
        }
      }
    }

      });
    }

    function getTodayKey() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getFutureDate(days) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function formatDateArabic(dateStr) {
      if (!dateStr) return '';
      try {
        const d = new Date(dateStr);
        return new Intl.DateTimeFormat('ar-JO-u-nu-latn', {
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        }).format(d);
      } catch (e) {
        return dateStr;
      }
    }

    function formatDateArabicFull(dateObj) {
      if (!dateObj) dateObj = new Date();
      try {
        return new Intl.DateTimeFormat('ar-JO-u-nu-latn', {
          weekday: 'long',
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        }).format(dateObj);
      } catch (e) {
        return dateObj.toDateString();
      }
    }

    // ============================================================
    // WEB AUDIO API CHIME & AUDIO SYNTHESIS
    // ============================================================
    let audioCtx = null;
    let currentAlarmAudio = null;
    let activeRecordingMedId = null;
    let mediaStream = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playChime() {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        // Soothing 3-tone harmonic chime (F5, A5, C6)
        const freqs = [698.46, 880.00, 1046.50];
        freqs.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.18);

          gain.gain.setValueAtTime(0, now + idx * 0.18);
          gain.gain.linearRampToValueAtTime(0.28, now + idx * 0.18 + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.18 + 0.65);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(now + idx * 0.18);
          osc.stop(now + idx * 0.18 + 0.7);
        });
      } catch (err) {
        console.log('Chime playback error:', err);
      }
    }

    // Generates a self-contained 8-bit PCM WAV bell chime in base64
    function createSampleToneWav(freq = 587.33, duration = 1.3) {
      const sampleRate = 8000;
      const numSamples = Math.floor(sampleRate * duration);
      const buffer = new Uint8Array(44 + numSamples);

      // "RIFF" chunk descriptor
      buffer[0] = 0x52; buffer[1] = 0x49; buffer[2] = 0x46; buffer[3] = 0x46;
      const fileSize = 36 + numSamples;
      buffer[4] = fileSize & 0xff; buffer[5] = (fileSize >> 8) & 0xff;
      buffer[6] = (fileSize >> 16) & 0xff; buffer[7] = (fileSize >> 24) & 0xff;
      buffer[8] = 0x57; buffer[9] = 0x41; buffer[10] = 0x46; buffer[11] = 0x45; // "WAVE"

      // "fmt " subchunk
      buffer[12] = 0x66; buffer[13] = 0x6d; buffer[14] = 0x74; buffer[15] = 0x20;
      buffer[16] = 16; buffer[17] = 0; buffer[18] = 0; buffer[19] = 0; // Subchunk size
      buffer[20] = 1; buffer[21] = 0; // AudioFormat = 1 (PCM)
      buffer[22] = 1; buffer[23] = 0; // 1 Channel (Mono)
      buffer[24] = sampleRate & 0xff; buffer[25] = (sampleRate >> 8) & 0xff;
      buffer[26] = (sampleRate >> 16) & 0xff; buffer[27] = (sampleRate >> 24) & 0xff; // SampleRate
      buffer[28] = sampleRate & 0xff; buffer[29] = (sampleRate >> 8) & 0xff;
      buffer[30] = (sampleRate >> 16) & 0xff; buffer[31] = (sampleRate >> 24) & 0xff; // ByteRate
      buffer[32] = 1; buffer[33] = 0; // BlockAlign
      buffer[34] = 8; buffer[35] = 0; // BitsPerSample = 8

      // "data" subchunk
      buffer[36] = 0x64; buffer[37] = 0x61; buffer[38] = 0x74; buffer[39] = 0x61;
      buffer[40] = numSamples & 0xff; buffer[41] = (numSamples >> 8) & 0xff;
      buffer[42] = (numSamples >> 16) & 0xff; buffer[43] = (numSamples >> 24) & 0xff;

      for (let i = 0; i < numSamples; i++) {
        const t = i / sampleRate;
        const decay = Math.exp(-2.8 * t);
        const wave = Math.sin(2 * Math.PI * freq * t) * 0.7 + Math.sin(2 * Math.PI * (freq * 1.5) * t) * 0.3;
        buffer[44 + i] = Math.floor(128 + wave * decay * 120);
      }

      let binary = '';
      for (let i = 0; i < buffer.length; i++) {
        binary += String.fromCharCode(buffer[i]);
      }
      return 'data:audio/wav;base64,' + btoa(binary);
    }

    // ============================================================
    // VOICE MEDICINE ALARM & REMINDERS
    // ============================================================
    function speakReminder(med, childName) {
      const hour = new Date().getHours();
      const isMorning = hour < 14;
      const parentName = state.parentName || 'والدي';
      const noteText = med.note ? `، ${med.note}` : '';

      // 1) Play recorded family voice if available
      if (state.recordings && state.recordings[med.id]) {
        try {
          if (currentAlarmAudio) {
            currentAlarmAudio.pause();
            currentAlarmAudio.currentTime = 0;
          }
          currentAlarmAudio = new Audio(state.recordings[med.id]);
          const playPromise = currentAlarmAudio.play();
          if (playPromise !== undefined) {
            playPromise.then(() => {
              // If it's a sample bell tone, also speak the message after the chime!
              if (state.recordings[med.id].startsWith('data:audio/wav')) {
                setTimeout(() => {
                  fallbackTTS(med, childName, isMorning, parentName, noteText);
                }, 1200);
              }
            }).catch(err => {
              console.log('Recorded audio blocked, using speech synthesis:', err);
              fallbackTTS(med, childName, isMorning, parentName, noteText);
            });
          }
          return;
        } catch (err) {
          console.log('Audio playback error:', err);
        }
      }

      // 2) Fallback to SpeechSynthesis
      fallbackTTS(med, childName, isMorning, parentName, noteText);
    }

    function fallbackTTS(med, childName, isMorning, parentName, noteText) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      let phrase = '';
      if (childName) {
        phrase = TEXT.alarmChildReminder
          .replace('{childName}', childName)
          .replace('{medicine}', med.name);
        if (med.note) phrase += `، ${med.note}`;
      } else {
        const template = isMorning ? TEXT.alarmGreetingMorning : TEXT.alarmGreetingEvening;
        phrase = template
          .replace('{name}', parentName)
          .replace('{medicine}', med.name)
          .replace('{note}', med.note || '');
      }

      const utter = new SpeechSynthesisUtterance(phrase);
      utter.rate = 0.85;
      utter.pitch = 1.05;

      const voices = window.speechSynthesis.getVoices();
      const arabicVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('ar'));
      if (arabicVoice) {
        utter.voice = arabicVoice;
        utter.lang = arabicVoice.lang;
      } else {
        utter.lang = 'ar-JO';
      }

      utter.onerror = () => {
        showToast(TEXT.errorNoArabicVoice, 'warning');
      };

      window.speechSynthesis.speak(utter);
    }

    function startMedicineChecker() {
      if (alarmInterval) clearInterval(alarmInterval);
      alarmInterval = setInterval(checkMedications, 15000);
      checkMedications();
    }

    function checkMedications() {
      if (!state.medications || state.medications.length === 0) return;

      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const curTime = `${hh}:${mm}`;
      const today = getTodayKey();

      // Check snoozes
      if (state.alarmSnooze) {
        for (const [medIdStr, snoozeTime] of Object.entries(state.alarmSnooze)) {
          if (now.getTime() >= snoozeTime) {
            delete state.alarmSnooze[medIdStr];
            saveState();
            const snoozedMed = state.medications.find(m => String(m.id) === String(medIdStr));
            if (snoozedMed) {
              triggerAlarm(snoozedMed);
              return;
            }
          }
        }
      }

      // Check scheduled times
      for (const med of state.medications) {
        const isTaken = state.medLog[today] && state.medLog[today][med.id];
        if (isTaken) continue;

        if (state.alarmSnooze && state.alarmSnooze[med.id]) continue;

        if (curTime === med.time) {
          const triggerKey = `${today}_${curTime}`;
          if (med._lastTriggeredKey !== triggerKey) {
            med._lastTriggeredKey = triggerKey;
            triggerAlarm(med);
            return;
          }
        }
      }
    }

    function triggerAlarm(med) {
      currentAlarmMed = med;
      const today = getTodayKey();

      // Find family member name
      let childName = TEXT.sampleChildName;
      if (state.contacts && state.contacts.length > 0) {
        const found = state.contacts.find(c =>
          (c.relation && (c.relation.includes('ابنة') || c.relation.includes('ابن'))) ||
          c.name.includes('ريم')
        );
        if (found) childName = found.name.replace(/\(.*?\)/g, '').trim();
      }

      // Play soft chime then voice
      playChime();
      setTimeout(() => {
        speakReminder(med, childName);
      }, 600);

      // Populate full-screen overlay
      const overlay = document.getElementById('alarmOverlay');
      const photoEl = document.getElementById('alarmChildPhoto');
      const childEl = document.getElementById('alarmChildName');
      const medEl = document.getElementById('alarmMedName');
      const noteEl = document.getElementById('alarmMedNote');

      if (photoEl) photoEl.textContent = '👧';
      if (childEl) childEl.textContent = TEXT.alarmChildLabel.replace('{childName}', childName);
      if (medEl) medEl.textContent = med.name;
      if (noteEl) noteEl.textContent = `${med.dose || ''} ${med.note ? '· ' + med.note : ''}`;

      if (overlay) overlay.classList.add('active');

      // Update repeat counter
      if (!state.alarmRepeatCount) state.alarmRepeatCount = {};
      state.alarmRepeatCount[med.id] = (state.alarmRepeatCount[med.id] || 0) + 1;

      // Raise family alert if unanswered 3 times
      if (state.alarmRepeatCount[med.id] >= 3) {
        const alertMsg = TEXT.alarmMissedAlert
          .replace('{name}', state.parentName || 'الوالد')
          .replace('{medicine}', med.name);

        const alreadyExists = state.alerts.some(a => a.medId === med.id && a.date === today);
        if (!alreadyExists) {
          state.alerts.push({
            id: Date.now(),
            text: alertMsg,
            date: today,
            medId: med.id
          });
          saveState();
        }
      }

      // Browser Notification if granted
      if ('Notification' in window && Notification.permission === 'granted') {
        try {
          new Notification(TEXT.appName, {
            body: `${med.name}: ${med.dose || ''} ${med.note || ''}`,
            dir: 'rtl',
            lang: 'ar'
          });
        } catch (e) {
          console.log('Notification error:', e);
        }
      }
    }

    function alarmTakeMed() {
      if (currentAlarmAudio) {
        currentAlarmAudio.pause();
        currentAlarmAudio = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }

      const overlay = document.getElementById('alarmOverlay');
      if (overlay) overlay.classList.remove('active');

      if (currentAlarmMed) {
        takeMedicine(currentAlarmMed.id);
        if (state.alarmRepeatCount) delete state.alarmRepeatCount[currentAlarmMed.id];
        if (state.alarmSnooze) delete state.alarmSnooze[currentAlarmMed.id];
        saveState();
        currentAlarmMed = null;
      }
    }

    function alarmSnooze() {
      if (currentAlarmAudio) {
        currentAlarmAudio.pause();
        currentAlarmAudio = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }

      const overlay = document.getElementById('alarmOverlay');
      if (overlay) overlay.classList.remove('active');

      if (currentAlarmMed) {
        if (!state.alarmSnooze) state.alarmSnooze = {};
        // Snooze for 10 minutes
        state.alarmSnooze[currentAlarmMed.id] = Date.now() + 10 * 60 * 1000;
        saveState();
        showToast(TEXT.alarmSnoozeToast, 'info');
        currentAlarmMed = null;
      }
    }

    function triggerDemoAlarm() {
      if (!state.medications || state.medications.length === 0) {
        const sampleMed = {
          id: 999,
          name: 'كونكور (Concor 5mg)',
          time: '08:00',
          dose: 'حبة واحدة',
          note: 'بعد الإفطار — لضغط الدم'

      } else {

        triggerAlarm(med);
      }
    }
