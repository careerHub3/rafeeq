    async function startRecordingMed(medId) {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showToast(TEXT.voiceMicDenied, 'error');
        return;
      }

      try {
        showToast(TEXT.voiceExplain, 'info');
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });

        activeRecordingMedId = medId;
        recordedChunks = [];

        const options = { mimeType: 'audio/webm' };
        if (!MediaRecorder.isTypeSupported('audio/webm')) {
          delete options.mimeType;
        }

        mediaRecorder = new MediaRecorder(mediaStream, options);

        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) {
            recordedChunks.push(e.data);
          }
        };

        mediaRecorder.onstop = () => {
          if (recordedChunks.length > 0) {
            const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
            const reader = new FileReader();
            reader.onloadend = () => {
              if (!state.recordings) state.recordings = {};
              state.recordings[medId] = reader.result;
              saveState();
              showToast(TEXT.voiceSaved, 'success');
              renderVoiceMeds();
            };
            reader.readAsDataURL(blob);
          }
          if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
            mediaStream = null;
          }
        };

        mediaRecorder.start();
        renderVoiceMeds();

        // Timer
        let sec = 0;
        if (recordingTimerInterval) clearInterval(recordingTimerInterval);
        recordingTimerInterval = setInterval(() => {
          sec++;
          const timerEl = document.getElementById(`recTimer_${medId}`);
          if (timerEl) {
            const m = String(Math.floor(sec / 60)).padStart(2, '0');
            const s = String(sec % 60).padStart(2, '0');
            timerEl.textContent = `${m}:${s}`;
          }
        }, 1000);

      } catch (err) {
        console.error('Microphone error:', err);
        showToast(TEXT.errorMicDenied, 'error');
        activeRecordingMedId = null;
        renderVoiceMeds();
      }
    }

    function stopRecordingMed(medId) {
      if (recordingTimerInterval) {
        clearInterval(recordingTimerInterval);
        recordingTimerInterval = null;
      }

      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }

      activeRecordingMedId = null;
      renderVoiceMeds();
    }

    function playRecordedVoice(medId) {
      if (!state.recordings || !state.recordings[medId]) return;

      if (currentAlarmAudio) {
        currentAlarmAudio.pause();
        currentAlarmAudio.currentTime = 0;
      }

      currentAlarmAudio = new Audio(state.recordings[medId]);
      currentAlarmAudio.play().catch(e => {
        console.log('Audio playback error:', e);
      });
    }

    function reRecordVoice(medId) {
      startRecordingMed(medId);
    }

    function previewChildReminder(medId) {
      const med = state.medications.find(m => m.id === medId);
      if (!med) return;

      showToast(TEXT.voicePreviewChild, 'info');
      playChime();

      let childName = TEXT.sampleChildName;
      if (state.contacts && state.contacts.length > 0) {
        const found = state.contacts.find(c =>
          (c.relation && (c.relation.includes('ابنة') || c.relation.includes('ابن'))) ||
          c.name.includes('ريم')
        );
        if (found) childName = found.name.replace(/\(.*?\)/g, '').trim();
      }

      setTimeout(() => {
        speakReminder(med, childName);
      }, 600);
    }

    // ============================================================
    // FAMILY DASHBOARD
    // ============================================================
    function renderDashboard() {
      renderDashboardAlerts();
      renderDashboardTodayStatus();
      renderDashboardMoodChart();
      renderVoiceMeds();
      renderDashboardEditLists();
    }

    function renderDashboardAlerts() {
      const panel = document.getElementById('alertsPanel');
      const list = document.getElementById('alertsList');
      if (!panel || !list) return;

      if (!state.alerts || state.alerts.length === 0) {
        panel.classList.remove('has-alerts');
        list.innerHTML = '';
        return;
      }

      panel.classList.add('has-alerts');
      list.innerHTML = state.alerts.map(a => `
        <div class="alert-item">
          <span class="alert-icon">⚠️</span>
          <span class="alert-text">${a.text}</span>
          <button class="alert-dismiss" onclick="dismissAlert(${a.id})">${TEXT.alertDismiss}</button>
        </div>
      `).join('');
    }

    function dismissAlert(id) {
      state.alerts = state.alerts.filter(a => a.id !== id);
      saveState();
      renderDashboardAlerts();
    }

    function renderDashboardTodayStatus() {
      const grid = document.getElementById('dashStatusGrid');
      if (!grid) return;

      const today = getTodayKey();
      const now = new Date();
      const curTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      if (!state.medications || state.medications.length === 0) {
        grid.innerHTML = `<p style="color:var(--clr-text-light)">${TEXT.noData}</p>`;
        return;
      }

      let allTaken = true;
      let html = '<div class="dash-status-card">';

      state.medications.forEach(m => {
        const takenTime = state.medLog[today] && state.medLog[today][m.id];
        let dotClass = 'pending';
        let statusText = TEXT.medPending;

        if (takenTime) {
          dotClass = 'taken';
          statusText = `${TEXT.medTaken} (${takenTime})`;
        } else if (curTime > m.time) {
          dotClass = 'missed';
          statusText = TEXT.medMissed;
          allTaken = false;
        } else {
          allTaken = false;
        }

        html += `
          <div class="dash-med-status">
            <span class="status-dot ${dotClass}"></span>
            <div style="flex:1">
              <strong>${m.name}</strong>
              <div style="font-size:0.8rem; color:var(--clr-text-light)">${m.time} — ${m.dose || ''}</div>
            </div>
            <span style="font-size:0.85rem; font-weight:600">${statusText}</span>
          </div>
        `;
      });

      html += '</div>';

      // Summary card
      html += `
        <div class="dash-status-card ${!allTaken ? 'alert' : ''}">
          <h4 style="font-size:1rem; margin-bottom:10px">📊 ملخّص اليوم</h4>
          <p style="font-size:0.95rem; margin-bottom:8px">
            الوالد: <strong>${state.parentName || 'الحاجّ أبو أحمد'}</strong>
          </p>
          <p style="font-size:0.85rem; color:var(--clr-text-light); margin-bottom:12px">
            ${TEXT.lastActivity}: ${now.toLocaleTimeString('ar-JO', { hour: '2-digit', minute: '2-digit' })}
          </p>
          <div style="padding:10px; border-radius:var(--radius-sm); background:${allTaken ? '#E8F5E9' : '#FFF9E6'}; font-size:0.85rem; font-weight:700; color:${allTaken ? 'var(--clr-success)' : 'var(--clr-warning)'}">
            ${allTaken ? '✅ تمّ أخذ جميع الأدوية المحدّدة لليوم بنجاح.' : '🔔 بانتظار استكمال الجرعات في مواعيدها.'}
          </div>
        </div>
      `;

      grid.innerHTML = html;
    }

    function renderDashboardMoodChart() {
      const svg = document.getElementById('moodChart');
      if (!svg) return;

      const moods = state.moods || [];
      if (moods.length < 2) {
        svg.innerHTML = `
          <text x="350" y="100" text-anchor="middle" fill="#888" font-size="16" font-family="Cairo">
            ${TEXT.chartEmpty}
          </text>
        `;
        return;
      }

      // Take last 7 entries
      const data = moods.slice(-7);
      const points = [];
      const stepX = 600 / Math.max(1, data.length - 1);

      data.forEach((entry, idx) => {
        const x = 50 + idx * stepX;
        const val = Math.max(1, Math.min(5, entry.value));
        const y = 160 - (val - 1) * 28;
        points.push({ x, y, val, date: entry.date });
      });

      // SVG path
      const pathD = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
      const areaD = `${pathD} L ${points[points.length - 1].x} 180 L ${points[0].x} 180 Z`;

      const emojiMap = { 5: '😊', 4: '🙂', 3: '😐', 2: '😔', 1: '😢' };

      let svgContent = `
        <defs>
          <linearGradient id="moodGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#4A7C59" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#4A7C59" stop-opacity="0.0" />
          </linearGradient>
        </defs>
      `;

      // Horizontal guideline levels (1 to 5)
      for (let level = 1; level <= 5; level++) {
        const y = 160 - (level - 1) * 28;
        svgContent += `
          <line x1="40" y1="${y}" x2="660" y2="${y}" stroke="#E8E0D0" stroke-width="1" stroke-dasharray="4" />
          <text x="680" y="${y + 5}" text-anchor="middle" font-size="14">${emojiMap[level]}</text>
        `;
      }

      // Filled area
      svgContent += `<path d="${areaD}" fill="url(#moodGradient)" />`;

      // Trend line
      svgContent += `<path d="${pathD}" fill="none" stroke="var(--clr-olive)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />`;

      // Circles & Labels
      points.forEach(p => {
        let dayName = '';
        try {
          const d = new Date(p.date);
          dayName = new Intl.DateTimeFormat('ar-JO', { weekday: 'short' }).format(d);
        } catch (e) {
          dayName = p.date;
        }

        svgContent += `
          <circle cx="${p.x}" cy="${p.y}" r="6" fill="#FFF" stroke="var(--clr-olive)" stroke-width="3" />
          <text x="${p.x}" y="${p.y - 12}" text-anchor="middle" font-size="13">${emojiMap[p.val]}</text>
          <text x="${p.x}" y="195" text-anchor="middle" font-size="12" fill="var(--clr-text-light)" font-family="Cairo">${dayName}</text>
        `;
      });

      svg.innerHTML = svgContent;
    }

    function renderDashboardEditLists() {
      // Meds
      const medListEl = document.getElementById('dashMedList');
      if (medListEl) {
        medListEl.innerHTML = state.medications.map(m => `
          <div class="item-card">

      // Contacts
      const contactListEl = document.getElementById('dashContactList');

            <button class="item-remove" onclick="removeContact(${c.id}); renderDashboard();" aria-label="${TEXT.remove}">${TEXT.remove}</button>
          </div>
        `).join('');
      }
    }

      showConfirm(

    window.addEventListener('DOMContentLoaded', init);
